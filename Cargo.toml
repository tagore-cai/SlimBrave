[package]
name = "slimbrave"
version = "1.2.0"
edition = "2021"
description = "Cross-platform Brave Browser policy manager built with egui"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
chrono = "0.4"
uuid = { version = "1", features = ["v5"] }
base64 = "0.22"
fluent = "0.16"
unic-langid = "0.9"
fluent-langneg = "0.13"

[target.'cfg(not(target_os = "windows"))'.dependencies]
ureq = "2"
flate2 = "1"
tar = "0.4"
zip = "2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
ab_glyph = "0.2"
tempfile = "3"

[profile.release]
opt-level = 2

